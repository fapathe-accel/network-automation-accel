- name: Retrieve network configurations
  hosts: all
  gather_facts: false
  tasks:
    # fail with good error for Automation controller user
    - name: Determine that both AAP and Machine credentials are set
      ansible.builtin.assert:
        that:
          - "lookup('env', 'CONTROLLER_USERNAME') !=''"
        fail_msg:
          - "This Job requires two credentials"
          - "Red Hat Ansible Automation Platform credential is not set"
          - "Please assign correct credentials to the Job Template"
    - name: Determine that both AAP and Machine credentials are set
      ansible.builtin.debug:
        msg:
          - "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
          - "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
          - "{{ lookup('env', 'CONTROLLER_HOST') }}"
    - name: Backup configuration
      ansible.builtin.include_role:
        name: "../roles/backup"
      when: ansible_network_os is defined
    - name: Set inventory name fact
      ansible.builtin.set_fact:
        inv_name: "{{ inventory_name | default(inventory_file | basename | splitext | first) }}"
      delegate_to: backup-server
      delegate_facts: true
      run_once: true
    - name: Create time stamp for play
      ansible.builtin.set_fact:
        datetime: "{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M') }}"
      delegate_to: backup-server
      delegate_facts: true
      run_once: true
    - name: Create a directory with today's date named after the inventory
      ansible.builtin.file:
        path: "/backup/{{ hostvars['backup-server'].inv_name }}/{{ hostvars['backup-server'].datetime }}/"
        state: directory
        mode: "755"
      delegate_to: backup-server
      become: true
      run_once: true
    - name: Save configuration to backup server
      ansible.builtin.copy:
        src: "{{ config_output.backup_path }}"
        dest: "/backup/{{ hostvars['backup-server'].inv_name }}/{{ hostvars['backup-server'].datetime }}/{{ inventory_hostname }}.cfg"
        mode: "644"
      when: config_output is defined
      become: true
      delegate_to: backup-server
    - name: Find backups
      ansible.builtin.find:
        paths: /backup
        file_type: directory
      register: backups
      run_once: true
      become: true
      delegate_to: backup-server
      delegate_facts: true
    # ── Installation cifs-utils ───────────────────────────────────────────────
    - name: Install cifs-utils package
      ansible.builtin.package:
        name: cifs-utils
        state: present
      delegate_to: backup-server
      become: true
      run_once: true
    # ── Montage partage Windows ───────────────────────────────────────────────
    - name: Create mount point directory
      ansible.builtin.file:
        path: /mnt/netsec_backups
        state: directory
        mode: "755"
      delegate_to: backup-server
      become: true
      run_once: true
    - name: Mount Windows network share
      ansible.posix.mount:
        src: "//{{ smb_server_ip }}/Accel_technologies/Knowledgebase/NetSec_Backups"
        path: /mnt/netsec_backups
        fstype: cifs
        opts: "username={{ smb_user }},password={{ smb_password }},uid=1000,gid=1000,file_mode=0644,dir_mode=0755"
        state: mounted
      delegate_to: backup-server
      become: true
      run_once: true
    # ── Copie vers partage Windows ────────────────────────────────────────────
    - name: Create directory on network share
      ansible.builtin.file:
        path: "/mnt/netsec_backups/{{ hostvars['backup-server'].inv_name }}/{{ hostvars['backup-server'].datetime }}/"
        state: directory
        mode: "755"
      delegate_to: backup-server
      become: true
      run_once: true
    - name: Copy configuration to network share
      ansible.builtin.copy:
        src: "{{ config_output.backup_path }}"
        dest: "/mnt/netsec_backups/{{ hostvars['backup-server'].inv_name }}/{{ hostvars['backup-server'].datetime }}/{{ inventory_hostname }}.cfg"
        mode: "644"
      when: config_output is defined
      become: true
      delegate_to: backup-server
    # ── Démontage partage Windows ─────────────────────────────────────────────
    - name: Unmount Windows network share
      ansible.posix.mount:
        path: /mnt/netsec_backups
        state: unmounted
      delegate_to: backup-server
      become: true
      run_once: true
